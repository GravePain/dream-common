<!doctype html>
<html data-app="sound">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dream audio demo</title>
<link rel="stylesheet" href="ui/theme.css">
<style>
  body { margin: 0; padding: 24px; background: var(--ui-bg); color: var(--ui-text); font: 14px system-ui, sans-serif; }
  h1 { font-size: 18px; color: var(--accent); margin: 0 0 4px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ui-dim); margin: 22px 0 8px; }
  p { color: var(--ui-dim); max-width: 60em; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button { padding: 8px 12px; }
  .keys { display: flex; gap: 3px; }
  .keys button { width: 40px; height: 90px; display: flex; align-items: flex-end; justify-content: center; }
  .keys button.black { background: #111; color: #aaa; }
  code { color: var(--accent-2); }
</style>
</head>
<body class="dream-ui">
<h1>Dream audio</h1>
<p>Library pieces played through <code>/common/audio.js</code>, the runtime the game uses and Dream Sound previews with.
Make sounds, synth presets and clips in Dream Sound; the first of each in the Library shows up here.</p>

<h2>Sounds</h2>
<div class="row" id="sounds">Loading…</div>
<h2>Synth preset <span id="synth-name"></span></h2>
<div class="keys" id="keys"></div>
<h2>Clip <span id="clip-name"></span></h2>
<div class="row"><button id="loop">⟲ Loop</button><button id="stop">■ Stop</button> <span id="step"></span></div>

<script type="module">
import * as audio from './audio.js';
import { listLibrary } from './library.js';
const $ = (id) => document.getElementById(id);

const { items } = await listLibrary({ kind: ['audio', 'synth', 'clip'] }).catch(() => ({ items: [] }));
const by = (k) => items.filter((i) => i.kind === k);

// three sounds
const sounds = by('audio').slice(0, 3);
$('sounds').textContent = sounds.length ? '' : 'No sounds in the Library yet.';
for (const it of sounds) {
  const b = document.createElement('button');
  b.textContent = `▶ ${it.name}`;
  b.onclick = async () => audio.play(await audio.loadSound(it.placeId ?? it.place, it.path));
  $('sounds').append(b);
}

// a synth preset over one octave
const synthItem = by('synth')[0];
const preset = synthItem ? await (await fetch(audio.fileUrl(synthItem.placeId ?? synthItem.place, synthItem.path))).json() : audio.DEFAULT_SYNTH;
$('synth-name').textContent = `· ${preset.name}`;
for (let n = 60; n <= 72; n++) {
  const b = document.createElement('button'), black = [1, 3, 6, 8, 10].includes(n % 12);
  b.className = black ? 'black' : '';
  b.textContent = n === 60 || n === 72 ? `C${n / 12 - 1}` : '';
  b.onpointerdown = () => audio.synthNote(preset, n, 0.4);
  $('keys').append(b);
}

// a clip, looping
const clipItem = by('clip')[0];
let clip = null, handle = null;
if (clipItem) {
  clip = await audio.loadClip(clipItem.placeId ?? clipItem.place, clipItem.path);
  $('clip-name').textContent = `· ${clip.def.name} (${clip.def.steps} steps at ${clip.def.tempo})`;
} else $('clip-name').textContent = '· none in the Library yet';
$('loop').onclick = () => { if (!clip) return; handle?.stop(); handle = audio.playClip(clip, { loop: true, onStep: (s) => { $('step').textContent = s >= 0 ? `step ${s + 1}` : ''; } }); };
$('stop').onclick = () => { handle?.stop(); handle = null; };
window.dreamAudioDemo = { audio, sounds, preset, get clip() { return clip; }, get handle() { return handle; } };
</script>
</body>
</html>
